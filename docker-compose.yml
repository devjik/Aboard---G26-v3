# Aboard — Docker Compose (web app + PostgreSQL + optional tracking)
services:
  # PostgreSQL database — port 5432
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aboard
      POSTGRES_PASSWORD: aboarddev
      POSTGRES_DB: aboard
    ports:
      - "5432:5432"
    volumes:
      - aboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Main Next.js app — port 3000
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=postgresql://aboard:aboarddev@db:5432/aboard?schema=public
      - ABOARD_SESSION_SECRET=aboard-dev-secret-change-me-32-chars-min
      - ABOARD_PAYMENT_SANDBOX_KEY=aboard-sandbox-key
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Socket.IO tracking mini-service — port 3003 (optional)
  tracker:
    build: .
    ports:
      - "3003:3003"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://aboard:aboarddev@db:5432/aboard?schema=public
      - ABOARD_SESSION_SECRET=aboard-dev-secret-change-me-32-chars-min
    command: ["bun", "--hot", "mini-services/tracking/index.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]  # only starts with: docker compose --profile full up

volumes:
  aboard_pg:
