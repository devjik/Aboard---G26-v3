# Aboard — Docker Compose (web app + PostgreSQL)
services:
  # PostgreSQL database — port 5432
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aboard
      POSTGRES_PASSWORD: aboarddev
      POSTGRES_DB: aboard
    ports:
      - "5432:5432"
    volumes:
      - aboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Main Next.js app — port 3000
  # Uses Supabase Realtime for live driver GPS tracking (if env vars set).
  # Without Supabase env vars, falls back to simulated driver positions.
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=postgresql://aboard:aboarddev@db:5432/aboard?schema=public
      - ABOARD_SESSION_SECRET=aboard-dev-secret-change-me-32-chars-min
      - ABOARD_PAYMENT_SANDBOX_KEY=aboard-sandbox-key
      - NODE_ENV=development
      # Supabase Realtime — set these to enable live driver GPS tracking.
      # If not set, the app uses simulated driver positions on the live map.
      # Get from: Supabase Dashboard → Settings → API
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aboard_pg:
